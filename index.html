<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINBAO - แมวส้มคุมแคล!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        :root { --primary: #fb923c; --primary-dark: #ea580c; --bg: #fff7ed; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #431407; margin: 0; }
        
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 2rem; border: 3px solid #fed7aa; box-shadow: 0 8px 0 #fed7aa; padding: 25px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 15px; border: 2px solid #f3f4f6; border-radius: 1.2rem; outline: none; text-align: center; font-family: 'Kanit'; font-weight: bold; margin-bottom: 15px; }
        .btn { padding: 15px; border-radius: 1.2rem; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Kanit'; width: 100%; font-size: 1.1rem; }
        .btn-main { background: var(--primary); color: white; border-bottom: 5px solid var(--primary-dark); }
        .btn-main:active { border-bottom: 0; transform: translateY(5px); }
        .btn-google { background: white; border: 2px solid #f3f4f6; border-bottom: 4px solid #e5e7eb; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .progress-bar { transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #saveToast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #7c2d12; color: white; padding: 12px 24px; border-radius: 999px; font-weight: bold; transition: 0.4s; opacity: 0; z-index: 100; text-align: center; width: 80%; max-width: 300px; }
        #saveToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body class="p-4">

    <div id="register-screen" class="screen">
        <div class="card max-w-sm mx-auto mt-10 text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/802/802353.png" class="w-20 mx-auto mb-4">
            <h1 class="text-3xl font-black text-orange-600 mb-2">สร้างบัญชีใหม่</h1>
            <p class="text-orange-400 mb-6">เริ่มคุมแคลกับจินเป่าเมี้ยว!</p>
            <input type="email" id="reg-email" class="input-field" placeholder="อีเมล">
            <input type="password" id="reg-pass" class="input-field" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)">
            <button class="btn btn-main" onclick="window.handleRegister()">ลงทะเบียน</button>
            <p class="mt-4">เป็นทาสแมวอยู่แล้ว? <a href="#" onclick="navigate('login-screen')" class="text-orange-600 font-bold">เข้าสู่ระบบ</a></p>
        </div>
    </div>

    <div id="login-screen" class="screen active-screen">
        <div class="card max-w-sm mx-auto mt-10 text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/802/802353.png" class="w-20 mx-auto mb-4">
            <h1 class="text-4xl font-black text-orange-600 mb-2">JINBAO</h1>
            <p class="text-orange-400 mb-6">LOGIN</p>
            <input type="email" id="login-email" class="input-field" placeholder="อีเมล">
            <input type="password" id="login-pass" class="input-field" placeholder="รหัสผ่าน">
            <button class="btn btn-main" onclick="window.handleEmailLogin()">เข้าสู่ระบบ</button>
            <p class="my-4 font-bold text-orange-200">OR</p>
            <button class="btn btn-google" onclick="window.handleGoogleLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                <span>Continue with Google</span>
            </button>
            <p class="mt-6">ยังไม่มีบัญชี? <a href="#" onclick="navigate('register-screen')" class="text-orange-600 font-bold">สมัครสมาชิกเมี้ยว</a></p>
        </div>
    </div>

    <div id="mainApp" class="screen max-w-md mx-auto space-y-6">
        <div id="saveToast">🐱 บันทึกเรียบร้อยแล้วเมี้ยว!</div>

        <header class="flex justify-between items-center bg-white p-4 rounded-2xl border-2 border-orange-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1"><span class="text-xl">🔥</span><span id="streakDisplay" class="text-lg font-black text-orange-500">1</span></div>
                <div class="flex items-center gap-1"><span class="text-xl">🪙</span><span id="coinDisplay" class="text-lg font-black text-yellow-600">0</span></div>
            </div>
            <h1 class="text-2xl font-black text-orange-600 tracking-tight leading-none text-center">JINBAO<br><span id="userTag" class="text-[10px] font-bold text-orange-300 uppercase"></span></h1>
            <div id="catEmojiHeader" class="text-3xl transition-transform duration-500">🐱</div> 
        </header>

        <section class="card text-center">
            <div id="catStatusMsg" class="text-[10px] font-black uppercase tracking-widest text-orange-400 mb-2 italic">พร้อมคุมแคลหรือยังเมี้ยว?</div>
            <p class="text-orange-400 font-bold text-xs uppercase mb-1 tracking-widest">วันนี้กินได้อีก</p>
            <h2 id="remainingCal" class="text-6xl font-black text-orange-950 mb-3">0</h2>
            <div class="w-full bg-orange-50 h-5 rounded-full overflow-hidden border-2 border-orange-100">
                <div id="progressFill" class="progress-bar h-full bg-orange-500" style="width: 0%"></div>
            </div>
            <p class="mt-3 text-sm font-bold text-orange-800"><span id="totalConsumed">0</span> / 1922 kcal</p>
        </section>

        <details class="card p-4 overflow-hidden group">
            <summary class="list-none cursor-pointer flex justify-between items-center font-black text-orange-400 uppercase text-sm">
                <span>🍽️ บันทึกมื้อนี้เมี้ยว</span><i class="fas fa-chevron-down"></i>
            </summary>
            <div class="mt-4 space-y-4 pt-4 border-t-2 border-orange-50">
                <input type="text" id="foodInput" placeholder="กินอะไรเข้าไป?" class="input-field">
                <input type="number" id="calInput" placeholder="กี่แคลอรี่?" class="input-field text-2xl text-orange-600">
                <button id="btnSave" class="btn btn-main">บันทึกรับ 5 🪙!</button>
            </div>
        </details>

        <section>
            <h3 class="text-lg font-black text-orange-950 mb-3 italic">History Today</h3>
            <div id="historyList" class="space-y-3"></div>
        </section>

        <button onclick="window.handleLogout()" class="w-full py-4 bg-red-50 text-red-500 rounded-3xl font-black text-sm border-2 border-red-100">ออกจากระบบเมี้ยว</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config ของคุณ
        const firebaseConfig = { 
            apiKey: "AIzaSyBOj2rySPpmc8NH3GmtXBZEO2o0Z0IwwuI", 
            authDomain: "jinpao-nutration.firebaseapp.com", 
            projectId: "jinpao-nutration", 
            storageBucket: "jinpao-nutration.firebasestorage.app", 
            appId: "1:847606006040:web:94b8acba2fbe49fa9bde6d" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;

        // --- NAVIGATION ---
        window.navigate = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        };

        // --- AUTH FUNCTIONS ---
        window.handleRegister = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            try { 
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("สมัครสมาชิกสำเร็จ!");
            } catch(e) { alert("สมัครไม่สำเร็จ: " + e.message); }
        };

        window.handleEmailLogin = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch(e) { alert("อีเมลหรือรหัสผ่านผิดเมี้ยว!"); }
        };

        window.handleGoogleLogin = async () => {
            try { await signInWithPopup(auth, googleProvider); } 
            catch(e) { console.error(e); }
        };

        window.handleLogout = () => signOut(auth);

        // --- AUTH STATE MONITOR ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                navigate('mainApp');
                document.getElementById('userTag').innerText = user.email.split('@')[0];
                renderData();
            } else {
                currentUser = null;
                navigate('login-screen');
            }
        });

        // --- MAIN APP LOGIC ---
        document.getElementById('btnSave').onclick = async () => {
            if(!currentUser) return;
            const name = document.getElementById('foodInput').value, cal = parseFloat(document.getElementById('calInput').value);
            if(!name || isNaN(cal)) return alert("ใส่ข้อมูลให้ครบ!");
            
            await addDoc(collection(db, "food_logs"), { 
                uid: currentUser.uid, 
                foodName: name, 
                calories: cal, 
                timestamp: serverTimestamp(), 
                date: new Date().toLocaleDateString() 
            });
            
            document.getElementById('foodInput').value = ""; document.getElementById('calInput').value = "";
            showToast("🐱 บันทึกแล้วเมี้ยว!");
            renderData();
        };

        async function renderData() {
            if(!currentUser) return;
            const list = document.getElementById('historyList'); 
            const today = new Date().toLocaleDateString();
            let total = 0;

            const q = query(
                collection(db, "food_logs"), 
                where("uid", "==", currentUser.uid),
                orderBy("timestamp", "desc")
            );

            const snap = await getDocs(q);
            list.innerHTML = "";
            
            snap.forEach(item => {
                const d = item.data();
                if(d.date === today) {
                    total += d.calories;
                    list.innerHTML += `<div class="bg-white p-4 rounded-2xl border-2 border-orange-100 flex justify-between items-center shadow-sm">
                        <div><p class="font-black text-orange-950">${d.foodName}</p><p class="text-orange-600 font-bold">${d.calories} kcal</p></div>
                        <button onclick="window.delItem('${item.id}')" class="text-orange-200"><i class="fas fa-times-circle text-2xl"></i></button>
                    </div>`;
                }
            });

            document.getElementById('totalConsumed').innerText = total;
            document.getElementById('remainingCal').innerText = Math.max(0, 1922 - total);
            document.getElementById('progressFill').style.width = Math.min(100, (total / 1922) * 100) + "%";
        }

        window.delItem = async (id) => { if(confirm("ลบเมี้ยว?")) { await deleteDoc(doc(db, "food_logs", id)); renderData(); } };
        function showToast(msg) { const t = document.getElementById('saveToast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    </script>
</body>
</html>
